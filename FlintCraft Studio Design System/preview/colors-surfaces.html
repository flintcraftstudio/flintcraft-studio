<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FlintCraft — Color Tokens (Primary)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--fc-chalk); padding: 24px; box-sizing: border-box; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw {
    border: 0.5px solid var(--fc-ash);
    border-radius: var(--fc-radius-md);
    overflow: hidden;
    background: var(--fc-chalk);
  }
  .chip { height: 76px; }
  .meta { padding: 10px 12px 12px; }
  .name {
    font-family: var(--fc-font-body);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fc-obsidian);
  }
  .hex {
    font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--fc-slate);
    margin-top: 3px;
  }
  .role {
    font-family: var(--fc-font-body);
    font-size: 10px;
    color: var(--fc-slate);
    margin-top: 6px;
    line-height: 1.4;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background: #17181A"></div>
      <div class="meta">
        <div class="name">Obsidian</div>
        <div class="hex">#17181A</div>
        <div class="role">Dark page · text on light</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background: #3B3E43"></div>
      <div class="meta">
        <div class="name">Flint</div>
        <div class="hex">#3B3E43</div>
        <div class="role">Raised dark surface · body text on light</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background: #F5F5F3; border-bottom: 0.5px solid var(--fc-ash)"></div>
      <div class="meta">
        <div class="name">Chalk</div>
        <div class="hex">#F5F5F3</div>
        <div class="role">Light page · text on dark</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background: #FFFFFF; border-bottom: 0.5px solid var(--fc-ash)"></div>
      <div class="meta">
        <div class="name">White</div>
        <div class="hex">#FFFFFF</div>
        <div class="role">Raised light surface</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background: #FCEEDF"></div>
      <div class="meta">
        <div class="name">Ember Tint</div>
        <div class="hex">#FCEEDF</div>
        <div class="role">Soft accent background · light</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background: #D5D7DA"></div>
      <div class="meta">
        <div class="name">Ash</div>
        <div class="hex">#D5D7DA</div>
        <div class="role">Borders · 0.5px · body text on dark</div>
      </div>
    </div>
  </div>
</body>
</html>
