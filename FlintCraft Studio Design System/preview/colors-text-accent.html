<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FlintCraft — Text & Accent Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--fc-chalk); padding: 24px; box-sizing: border-box; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw {
    border: 0.5px solid var(--fc-ash);
    border-radius: var(--fc-radius-md);
    overflow: hidden;
  }
  .chip { height: 76px; }
  .meta { padding: 10px 12px 12px; }
  .name {
    font-family: var(--fc-font-body);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fc-obsidian);
  }
  .hex {
    font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--fc-slate);
    margin-top: 3px;
  }
  .role {
    font-family: var(--fc-font-body);
    font-size: 10px;
    color: var(--fc-slate);
    margin-top: 6px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background: #3B3E43"></div>
      <div class="meta">
        <div class="name">Flint</div>
        <div class="hex">#3B3E43</div>
        <div class="role">Body text · light bg</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background: #666B72"></div>
      <div class="meta">
        <div class="name">Slate</div>
        <div class="hex">#666B72</div>
        <div class="role">Muted · captions · light bg</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background: #A85A14"></div>
      <div class="meta">
        <div class="name">Ember Deep</div>
        <div class="hex">#A85A14</div>
        <div class="role">Accent on light only</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background: #D5D7DA"></div>
      <div class="meta">
        <div class="name">Ash</div>
        <div class="hex">#D5D7DA</div>
        <div class="role">Body text · dark bg</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background: #A7ADB5"></div>
      <div class="meta">
        <div class="name">Slate Light</div>
        <div class="hex">#A7ADB5</div>
        <div class="role">Muted · captions · dark bg</div>
      </div>
    </div>
    <div class="sw">
      <div class="chip" style="background: #EE9440"></div>
      <div class="meta">
        <div class="name">Ember</div>
        <div class="hex">#EE9440</div>
        <div class="role">Accent on dark only</div>
      </div>
    </div>
  </div>
</body>
</html>
